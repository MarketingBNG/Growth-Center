# Reverse proxy in front of the `app` container. Terminates plain HTTP here;
# add a TLS server block (443 + certificates) once you have a domain/certs —
# see the comment at the bottom.

upstream app {
  # "app" resolves via Docker Compose's internal DNS to the app service —
  # same mechanism as "postgres" in docker-compose.local-db.yml.
  server app:3000;
}

server {
  listen 80;
  server_name _;

  # Real client IP/scheme through to Next.js (NextAuth needs to see the
  # original scheme/host to build correct callback URLs behind a proxy).
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    # Next.js dev/HMR doesn't run in this image, but keep upgrade headers
    # harmless to have for any future WebSocket use.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# To add HTTPS: obtain a certificate (e.g. via Certbot, or a GCP-managed
# certificate in front of this if you go that route instead), then add:
#
# server {
#   listen 443 ssl;
#   server_name your-domain.com;
#   ssl_certificate     /etc/nginx/certs/fullchain.pem;
#   ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   location / { proxy_pass http://app; ... same proxy_set_header lines ... }
# }
